name: "🚀 Publish Plugin"

on:
  release:
    types:
      - released
      # Confirmed live on this fork: gh release edit's draft->published
      # transition (used to re-fire a release event without cutting a
      # new version) only ever emits action: published, never released,
      # for a plain non-draft/non-prerelease release here - released
      # alone left this workflow silently never triggering. Both types
      # are harmless to list together (GitHub dedupes an event that
      # matches more than one listed type into a single run).
      - published
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/build.yaml@master
    with:
      dotnet-version: "10.0.*"
      dotnet-target: "net10.0"
  upload:
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v5
        with:
          name: build-artifact
      - name: Prepare GitHub Release assets
        run: |-
          for file in ./*; do
            md5sum ${file#./} >> ${file%.*}.md5
            sha256sum ${file#./} >> ${file%.*}.sha256
          done
          ls -l
      - name: Upload GitHub Release assets
        uses: shogo82148/actions-upload-release-asset@v1.9.0
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./*
  generate:
    runs-on: ubuntu-latest
    needs:
      - upload
    steps:
      - name: Jellyfin plugin repo
        uses: Kevinjil/jellyfin-plugin-repo-action@v0.4.3
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}